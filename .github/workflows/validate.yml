name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 微信小程序（前端静态校验 + 单元测试） ----------
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 静态校验（JSON / 页面四件套 / 组件 / require / 事件绑定）
        run: node scripts/validate.js

      - name: 单元测试 · 油耗引擎
        run: node tests/__fuel_test.js

      - name: 单元测试 · 保养提醒
        run: node tests/__maint_test.js

      - name: 端到端测试 · 数据流
        run: node tests/__e2e_test.js

  # ---------- 后端（Spring Boot 构建 + 测试） ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B test

  # ---------- 管理后台（Vue 3 构建） ----------
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # ---------- 小程序远程层 × 真实后端 端到端 ----------
  mp-remote-e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend jar
        working-directory: server
        run: mvn -B -q -DskipTests package

      - name: Start backend (H2)
        working-directory: server
        run: |
          nohup java -jar target/carlog-server.jar --server.port=8088 > /tmp/be.log 2>&1 &
          for i in $(seq 1 40); do
            if grep -q "Started CarlogApplication" /tmp/be.log; then echo "backend started"; break; fi
            sleep 1
          done

      - name: Mini-program remote data layer smoke test
        env:
          BASE: http://localhost:8088/api
        run: node scripts/mp_remote_smoke.js
